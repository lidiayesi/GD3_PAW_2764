<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>Form Pendaftaran</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="judul">Form Pendaftaran</h1>
        <a href="profil.html" onclick="return confirm('Apakah Anda yakin ingin kembali ke halaman Profil?')">Kembali ke Profil</a> |
        <a href="interaktif.html"  onclick="return confirm('Apakah Anda yakin ingin membuka halaman Interaktif?')">Buka Halaman Interaktif</a>
        <br><br>

        <form action="#" method="post" class="card">
            <label for="inputNama">Nama Lengkap</label><br>
            <input type="text" id="inputNama" name="nama" placeholder="Masukkan nama" required>
            <br><br>

            <label>Jenis Kelamin:</label><br>
            <input type="radio" id="pria" name="jenis_kelamin" value="Pria" required>
            <label for="pria">Pria</label>
            <input type="radio" id="wanita" name="jenis_kelamin" value="Wanita" required>
            <label for="pria">Wanita</label>
            <br><br>

            <label for="inputProdi">Program Studi</label><br>
            <select id="inputrProdi" name="prodi" required>
                <option value=""">--Pilih Program Studi --</option>
                <option value="Informatika">Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknik Industri">Teknik Industri</option>
            </select>
            <br><br>

            <label for="inputEmail">Email:</label><br>
            <input type="email" id="inputEmail" name="email" placeholder="contoh@email.com" required>
            <br><br>

            <label for="inputAlasan">Alasan Mendaftar:</label><br>
            <textarea id="inputAlasan" name="alasan" rows="4" cols="30" placeholder="Tulis Alasan disini" required></textarea>
            <br><br>
            
            <input type="submit" value="Kirim Pendaftaran">
            <br><br>
        </form>
    </body>
</html>
