<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Halaman Interaktif</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="judulHalaman">Halaman Interaktif</h1>

        <p id="teks">Teks ini bisa berubah!</p>
        <button onclick="ubahBiru()">Ubah ke Biru</button>

        <br><br>
        <label for="inputNama">Nama</label><br>
        <input type="text" id="inputNama" placeholder="Masukkan nama">
        <button onclick="tampilkanNama()">Tampilkan</button>

        <br><br>
        <label for="inputAngka">Masukkan Angka: </label><br>
        <input type="number" id="inputAngka" placeholder="Masukkan angka">
        <button onclick="hitungKuadrat()">Hitung Kuadrat</button>
        <p id="hasilKuadrat"></p>

        <br><br>
        <a href="profil.html" onclick="return confirm('Apakah Anda yakin ingin kembali ke halaman Profil?')">Kembali ke Profil</a> |
        <a href="form.html" onclick="return confirm('Apakah Anda yakin ingin membuka Form Pendaftaran?')">Buka Form Pendaftaran</a>

        <script>
            const judul = document.getElementById("judulHalaman");
            judul.style.color ="green";
            console.log(judul.innerHTML);

            function ubahBiru(){
                const teksBerubah = document.getElementById("teks");
                teksBerubah.style.color = "blue";
            }

            function tampilkanNama(){
                const nama = document.getElementById("inputNama").value;

                if(nama == ""){
                    alert("Silahkan isi nama terlebih dahulu");
                }else{
                    alert("Halo, " + nama + "!");
                }
            }

            function hitungKuadrat(){
                const angka = document.getElementById("inputAngka").value;
                if(angka === ""){
                    alert("Silahkan masukkan terlebih dahulu");
                }else{
                    const hasil = angka * angka;
                    document.getElementById("hasilKuadrat").innerHTML = "Hasil Kuadrat: " + hasil;
                }
            }
        </script>
        
        <script>
            function sapa(nama){
                return "Halo, " + nama + "!";
            }
            console.log(sapa("Lidia"));
        </script>
    </body>
</html>
